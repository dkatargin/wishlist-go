# Air configuration for hot-reload (Worker). Отдельный tmp-каталог и бинарь,
# чтобы не конфликтовать с API при общем bind-mount /app.
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp-worker"

[build]
  args_bin = []
  bin = "./tmp-worker/worker"
  cmd = "go build -o ./tmp-worker/worker ./cmd/worker"
  delay = 1000
  exclude_dir = ["assets", "tmp", "tmp-worker", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go"]
  include_file = []
  kill_delay = "2s"
  log = "build-errors-worker.log"
  poll = false
  poll_interval = 0
  rerun = true
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[misc]
  clean_on_exit = false
